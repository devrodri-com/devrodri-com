<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">DevRodri GitHub activity</title>
  <desc id="description">GitHub activity during the last twelve months: 2,295 contributions, 977 public commits, 249 public pull requests, and 35 public repositories. Automatically updated daily.</desc>

  <defs>
    <linearGradient id="activity-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.04" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2" />

