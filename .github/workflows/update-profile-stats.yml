name: Update profile stats

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: true

jobs:
  update:
    name: Refresh GitHub activity card
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate current GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          GITHUB_USERNAME: devrodri-com
          PROFILE_TIMEZONE: America/New_York
        run: node scripts/generate-github-stats.mjs

      - name: Commit updated stats
        run: |
          if git diff --quiet -- assets/github-stats.svg; then
            echo "GitHub stats are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git commit -m "Update GitHub activity stats"
          git push
